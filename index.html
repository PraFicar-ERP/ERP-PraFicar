<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1B3A5C" />
  <meta name="description" content="PraFicar ERP — Feito pra lembrar, feito pra ficar." />
  <title>PraFicar ERP</title>

  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- CSS — núcleo -->
  <link rel="stylesheet" href="assets/css/variables.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/sku.css" />

  <!-- CSS — módulos -->
  <link rel="stylesheet" href="assets/css/modulos/produtos.css" />
  <link rel="stylesheet" href="assets/css/modulos/canais.css" />
  <link rel="stylesheet" href="assets/css/modulos/precificar.css" />
  <link rel="stylesheet" href="assets/css/modulos/encomendas.css" />
  <link rel="stylesheet" href="assets/css/modulos/vendas.css" />
  <link rel="stylesheet" href="assets/css/modulos/financeiro.css" />
  <link rel="stylesheet" href="assets/css/modulos/clientes.css" />
  <link rel="stylesheet" href="assets/css/modulos/relatorios.css" />
  <link rel="stylesheet" href="assets/css/modulos/qrcode.css" />
  <link rel="stylesheet" href="assets/css/modulos/configuracoes.css" />
</head>
<body>

  <div class="app" id="app">

    <!-- =====================================================
         SIDEBAR
         ===================================================== -->
    <aside class="sidebar" id="sidebar">

      <div class="sidebar__logo">
        <img src="assets/img/logo.png" alt="PraFicar" onerror="this.style.display='none'" />
        <div class="sidebar__logo-texto">
          <span class="sidebar__logo-nome">PraFicar</span>
          <span class="sidebar__logo-slogan">Feito pra lembrar, feito pra ficar</span>
        </div>
      </div>

      <nav class="sidebar__nav" id="sidebar-menu">
        <!-- preenchido via JS -->
      </nav>

      <div class="sidebar__rodape">
        <div class="sidebar__usuario">
          <div class="sidebar__avatar">AD</div>
          <div class="sidebar__usuario-info">
            <span class="sidebar__usuario-nome">Administrador</span>
            <span class="sidebar__usuario-cargo">Acesso total</span>
          </div>
        </div>
      </div>

    </aside>

    <!-- =====================================================
         HEADER
         ===================================================== -->
    <header class="header">

      <button class="header__toggle" id="btn-toggle-sidebar" aria-label="Alternar menu">
        <svg viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>

      <div class="header__breadcrumb">
        <span>PraFicar</span>
        <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
        <span class="header__breadcrumb-atual">Início</span>
      </div>

      <div class="header__busca">
        <!-- preenchido via JS -->
      </div>

      <div class="header__acoes" id="header-acoes">
        <!-- preenchido via JS -->
      </div>

    </header>

    <!-- =====================================================
         CONTEÚDO
         ===================================================== -->
    <main class="conteudo">
      <div class="conteudo__inner" id="conteudo-tela">
        <!-- preenchido via JS -->
      </div>
    </main>

  </div>

  <!-- Overlay mobile -->
  <div class="app-overlay" id="app-overlay"></div>

  <!-- =====================================================
       JS — biblioteca externa (QR Code)
       ===================================================== -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>

  <!-- =====================================================
       JS — núcleo
       ===================================================== -->
  <script src="assets/js/sku.js"></script>
  <script src="assets/js/router.js"></script>

  <!-- =====================================================
       JS — módulos
       ===================================================== -->
  <script src="assets/js/modulos/produtos.js"></script>
  <script src="assets/js/modulos/canais.js"></script>
  <script src="assets/js/modulos/precificar.js"></script>
  <script src="assets/js/modulos/encomendas.js"></script>
  <script src="assets/js/modulos/vendas.js"></script>
  <script src="assets/js/modulos/financeiro.js"></script>
  <script src="assets/js/modulos/clientes.js"></script>
  <script src="assets/js/modulos/relatorios.js"></script>
  <script src="assets/js/modulos/qrcode.js"></script>
  <script src="assets/js/modulos/configuracoes.js"></script>

  <!-- =====================================================
       JS — app principal (deve ser o último)
       ===================================================== -->
  <script src="assets/js/app.js"></script>

</body>
</html>
